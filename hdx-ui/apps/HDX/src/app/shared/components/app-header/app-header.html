<header class="header">
  <div class="header--container">
    <div class="header--logo">
      <a routerLink="/" class="logo--link" data-tour="logo">
        <span class="logo--wordmark">HDX</span>
        <span class="logo--tagline">Health Data Exchange · Federation Console</span>
      </a>
    </div>

    <nav class="header--nav" aria-label="Main">
      <ul class="nav--menu">
        @for (link of navLinks; track link.path) {
          <li class="nav--item">
            <a
              [routerLink]="link.path"
              routerLinkActive="nav--link-active"
              class="nav--link"
              [attr.data-tour]="link.tourId ?? null"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="header--user">
      <button type="button" class="tour--trigger" (click)="tour.start()">
        <i class="pi pi-compass"></i>
        Take a tour
      </button>
      <app-user-menu [username]="username" [isAdmin]="auth.isAdmin()" (logoutClick)="logout()" />
    </div>
  </div>
</header>
