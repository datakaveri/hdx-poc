<div class="concept-graph">
  <div class="concept-graph__controls" data-tour="concept-graph-controls">
    <button type="button" [disabled]="currentView() === 'master'" (click)="showMaster()">Overview</button>
    <button type="button" (click)="fitGraph()">Fit graph</button>
    <button type="button" (click)="zoomBy(1.25)">Zoom +</button>
    <button type="button" (click)="zoomBy(0.8)">Zoom −</button>
  </div>

  <div class="concept-graph__canvas" data-tour="concept-graph-canvas">
    <svg #graphSvg class="concept-graph__svg" role="img" [attr.aria-label]="svgAriaLabel()"></svg>

    <div class="breadcrumb">
      @if (currentView() === 'master') {
        <strong>Overview</strong>
      } @else {
        <span>Overview</span><span>›</span><strong>{{ currentGraphTitle() }}</strong>
      }
    </div>

    <div class="legend" role="group" aria-label="Toggle domain visibility" data-tour="concept-graph-legend">
      @for (item of legendItems(); track item.type) {
        <button
          type="button"
          class="legend-item"
          [class.legend-item--off]="hiddenTypes().has(item.type)"
          [attr.aria-pressed]="!hiddenTypes().has(item.type)"
          [title]="hiddenTypes().has(item.type) ? 'Show ' + item.label : 'Hide ' + item.label"
          (click)="toggleType(item.type)"
        >
          <span class="swatch" [class]="'swatch--' + item.type"></span>{{ item.label }}
        </button>
      }
    </div>

    <div class="hint" [innerHTML]="hintHtml()"></div>

    <svg #minimapSvg class="minimap" role="img" aria-label="Minimap — click or drag to pan the graph" viewBox="0 0 180 120">
      <rect class="minimap-world" x="0" y="0" width="180" height="120"></rect>
      <rect class="minimap-cursor" x="0" y="0" width="0" height="0"></rect>
    </svg>

    @if (activeSample(); as sample) {
      <div class="fhir-modal-backdrop open" (click)="closeFHIRModal()">
        <section class="fhir-modal" role="dialog" aria-modal="true" aria-labelledby="fhirModalTitle" (click)="$event.stopPropagation()">
          <div class="fhir-modal-head">
            <div>
              <h2 id="fhirModalTitle" class="fhir-modal-title">{{ sample.title }}</h2>
              <div class="fhir-modal-subtitle" [innerHTML]="fhirSubtitleHtml()"></div>
            </div>
            <button #fhirCloseBtn class="fhir-close" type="button" aria-label="Close FHIR sample" (click)="closeFHIRModal()">×</button>
          </div>
          <div class="fhir-toolbar">
            <div class="fhir-tabs" role="tablist" aria-label="FHIR sample views">
              <button
                class="fhir-tab"
                [class.active]="activeFhirTab() === 'profile'"
                type="button"
                role="tab"
                [attr.aria-selected]="activeFhirTab() === 'profile'"
                (click)="setFHIRTab('profile')"
              >
                StructureDefinition
              </button>
              <button
                class="fhir-tab"
                [class.active]="activeFhirTab() === 'bundle'"
                type="button"
                role="tab"
                [attr.aria-selected]="activeFhirTab() === 'bundle'"
                (click)="setFHIRTab('bundle')"
              >
                Example Bundle
              </button>
            </div>
            <button type="button" (click)="copyFhir()">{{ copyLabel() }}</button>
          </div>
          <div class="fhir-code-wrap"><pre class="fhir-code">{{ fhirCode() }}</pre></div>
        </section>
      </div>
    }
  </div>
</div>
