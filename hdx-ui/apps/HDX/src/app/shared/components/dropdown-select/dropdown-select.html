<div class="custom-dropdown-wrapper">
  <div
    class="custom-dropdown-trigger"
    [attr.id]="id()"
    [class.open]="isOpen()"
    role="button"
    tabindex="0"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-labelledby]="labelledBy()"
    aria-haspopup="listbox"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
  >
    <span class="trigger-content">
      @if (selectedLabel()) {
        <span class="selected-value-name">{{ selectedLabel() }}</span>
      } @else {
        <span class="placeholder">{{ placeholder() }}</span>
      }
    </span>
    <svg class="dropdown-arrow" [class.rotated]="isOpen()" width="12" height="8" viewBox="0 0 12 8" fill="none">
      <path
        d="M1 1L6 6L11 1"
        stroke="var(--text-secondary)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>
  @if (isOpen()) {
    <div class="custom-dropdown-panel" (click)="$event.stopPropagation()">
      @for (option of options(); track option.value) {
        <div class="dropdown-option" [class.selected]="option.value === value()" (click)="select(option)">
          <div class="checkbox-wrapper">
            <input type="checkbox" class="checkbox-custom" [checked]="option.value === value()" readonly />
          </div>
          <span class="option-label">{{ option.label }}</span>
        </div>
      }
    </div>
  }
</div>
