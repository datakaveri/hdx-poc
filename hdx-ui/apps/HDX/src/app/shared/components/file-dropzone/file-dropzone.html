<div class="dropzone" [class.dropzone--active]="dragActive()" (dragover)="onDragOver($event)" (dragleave)="onDragLeave()" (drop)="onDrop($event)">
  <input class="dropzone__input" type="file" multiple (change)="onFileInput($event)" aria-label="Choose files to upload" />
  <div class="dropzone__icon">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path d="M7 10l5-5 5 5M12 5v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
  <p class="dropzone__text"><strong>Click to browse</strong> or drag and drop a sample file here</p>
  <p class="dropzone__hint">CSV, JSON, or FHIR bundle — uploaded to the Fileserver once you submit</p>
</div>

@if (files().length) {
  <div class="file-list">
    @for (file of files(); track file.name + file.size; let i = $index) {
      <div class="file-row">
        <span class="file-row__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path d="M14 2v6h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span class="file-row__name">{{ file.name }}</span>
        <span class="file-row__size">{{ formatSize(file.size) }}</span>
        <button type="button" class="file-row__remove" (click)="removeFile(i)" aria-label="Remove file">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    }
  </div>
}
