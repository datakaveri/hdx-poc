<div
  class="dropzone"
  [class.dropzone--active]="dragActive()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
>
  <input
    class="dropzone__input"
    type="file"
    accept=".yaml,.yml,.json,application/json,text/yaml"
    (change)="onFileInput($event)"
    aria-label="Choose an OpenAPI spec file"
  />
  <div class="dropzone__icon">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path d="M7 10l5-5 5 5M12 5v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
  <p class="dropzone__text"><strong>Click to browse</strong> or drag and drop an <code>openapi.yaml</code> / <code>.json</code> file</p>
  <p class="dropzone__hint">Parsed entirely in your browser — nothing is sent anywhere.</p>
</div>

@if (fileName()) {
  <div class="file-list">
    <div class="file-row">
      <span class="file-row__icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M14 2v6h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <span class="file-row__name">{{ fileName() }}</span>
    </div>
  </div>
}

<details class="spec-upload__paste">
  <summary>Or paste the spec text instead</summary>
  <div class="form-field">
    <textarea
      class="form-textarea"
      rows="6"
      [ngModel]="pastedText()"
      (ngModelChange)="pastedText.set($event)"
      placeholder="openapi: 3.0.0
info:
  title: ..."
    ></textarea>
    <button type="button" class="wizard-btn wizard-btn--secondary" (click)="parsePasted()">Parse pasted spec</button>
  </div>
</details>

@if (error()) {
  <span class="error-message">{{ error() }}</span>
}
