<header class="header">
  <div class="header--container">
    <div class="header--logo">
      <a routerLink="/" class="logo--link">
        <span class="logo--wordmark">HDX</span>
        <span class="logo--tagline">Health Data Exchange · Federation Console</span>
      </a>
    </div>

    <nav class="header--nav" aria-label="Main">
      <ul class="nav--menu">
        @for (link of navLinks(); track link.path) {
          <li class="nav--item">
            <a [routerLink]="link.path" routerLinkActive="nav--link-active" class="nav--link">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="header--user">
      @if (username) {
        <span class="user--name">{{ username }}</span>
      }
      <button type="button" class="user--logout" (click)="logout()">Logout</button>
    </div>
  </div>
</header>
