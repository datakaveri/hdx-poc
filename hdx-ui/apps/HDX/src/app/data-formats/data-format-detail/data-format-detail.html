@if (format(); as format) {
  <section class="format-detail">
    <header class="format-detail__intro">
      <a routerLink="/data-formats" class="format-detail__back">← Data Formats</a>
      <h1>{{ format.fullName }}</h1>
      <p>{{ format.description }}</p>
    </header>

    <div class="format-detail__graph">
      @switch (format.id) {
        @case ('mcxde') {
          <app-concept-graph
            [master]="mcxde.master"
            [detailGraphs]="mcxde.detailGraphs"
            [fhirSamples]="mcxde.fhirSamples"
            [legendItems]="mcxde.legendItems"
            [masterLayout]="mcxde.masterLayout"
            [hintHtml]="mcxde.hintHtml"
            [svgAriaLabel]="mcxde.svgAriaLabel"
            [fhirSubtitleFor]="mcxde.fhirSubtitleFor"
          />
        }
        @case ('mcode') {
          <app-concept-graph
            [master]="mcode.master"
            [detailGraphs]="mcode.detailGraphs"
            [fhirSamples]="mcode.fhirSamples"
            [legendItems]="mcode.legendItems"
            [masterLayout]="mcode.masterLayout"
            [hintHtml]="mcode.hintHtml"
            [svgAriaLabel]="mcode.svgAriaLabel"
            [fhirSubtitleFor]="mcode.fhirSubtitleFor"
          />
        }
      }
    </div>
  </section>
} @else {
  <section class="format-detail">
    <p class="empty-state">Unknown data format "{{ id() }}".</p>
    <a routerLink="/data-formats">← Back to Data Formats</a>
  </section>
}
