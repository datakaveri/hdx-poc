@if (tour.active()) {
  <div class="tour-scrim" [class.tour-scrim--fallback]="!display()"></div>

  @if (display(); as d) {
    <div
      class="tour-highlight"
      [style.top.px]="d.highlight.top"
      [style.left.px]="d.highlight.left"
      [style.width.px]="d.highlight.width"
      [style.height.px]="d.highlight.height"
    ></div>

    <div
      class="tour-popover"
      [style.top.px]="d.popover.top"
      [style.left.px]="d.popover.left"
      [style.width.px]="d.popover.width"
    >
      <ng-container [ngTemplateOutlet]="popoverContent" />
    </div>
  } @else {
    <div class="tour-popover tour-popover--centered">
      <ng-container [ngTemplateOutlet]="popoverContent" />
    </div>
  }
}

<ng-template #popoverContent>
  @if (tour.currentStep(); as step) {
    <div class="tour-popover__header">
      <span class="tour-popover__step">Step {{ tour.index() + 1 }} of {{ tour.total }}</span>
      <button type="button" class="tour-popover__close" (click)="tour.end()" aria-label="Close tour">&times;</button>
    </div>
    <h3 class="tour-popover__title">{{ step.title }}</h3>
    <p class="tour-popover__description">{{ step.description }}</p>
    <div class="tour-popover__actions">
      <button type="button" class="tour-popover__skip" (click)="tour.end()">Skip tour</button>
      <div class="tour-popover__nav">
        @if (!tour.isFirst()) {
          <button type="button" class="tour-popover__btn tour-popover__btn--ghost" (click)="tour.prev()">Back</button>
        }
        <button type="button" class="tour-popover__btn tour-popover__btn--primary" (click)="tour.next()">
          {{ tour.isLast() ? 'Finish' : 'Next' }}
        </button>
      </div>
    </div>
  }
</ng-template>
