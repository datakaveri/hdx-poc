name: hdx

services:
  # hapiproject/hapi runs as non-root uid:gid 65532:65532, but a fresh named
  # volume is created root-owned — so hapi-fhir can't create its own data dir
  # under it without this chown running first.
  hapi-fhir-data-init:
    image: busybox
    command: sh -c "mkdir -p /data/hapi && chown -R 65532:65532 /data/hapi"
    volumes:
      - hapi-fhir-data:/data/hapi

  hapi-fhir:
    image: hapiproject/hapi:latest
    depends_on:
      hapi-fhir-data-init:
        condition: service_completed_successfully
    environment:
      hapi.fhir.default_encoding: json
      hapi.fhir.fhir_version: R4
      # Default is `jdbc:h2:mem:test_mem` — a pure in-memory DB that never
      # touches disk at all, so hapi-fhir-data (below) was a no-op mount
      # against it. This is the actual Spring datasource property HAPI reads.
      spring.datasource.url: jdbc:h2:file:/data/hapi/h2/hapi;AUTO_SERVER=TRUE
    ports:
      # host 8082 so this stack can run alongside Keycloak (8081) and
      # other per-portal dev instances without a clash
      - "8082:8080"
    volumes:
      # Without this, the embedded H2 database lives only in the container's
      # writable layer — every bundle pushed by fhir-setup (below) vanishes on
      # the next `docker compose down` + `up`, unlike es-data/minio-data/
      # keycloak-data which all already persist the same way.
      - hapi-fhir-data:/data/hapi

  fhir-setup:
    image: alpine:3.20
    depends_on:
      - hapi-fhir
    volumes:
      - ./fhir:/fhir:ro
    environment:
      FHIR_BASE_URL: http://hapi-fhir:8080/fhir
    # Mirrors kc-setup's role for Keycloak and the ES seedIfEmpty()
    # pattern for datasets/services: idempotently makes sure the demo FHIR
    # bundles exist, so a wiped hapi-fhir-data volume (or a first-ever boot)
    # self-heals instead of silently leaving the FHIR-backed pages empty.
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache bash curl jq >/dev/null &&
      echo 'Waiting for HAPI FHIR...' &&
      until curl -sf http://hapi-fhir:8080/fhir/metadata >/dev/null; do sleep 3; done &&
      COUNT=$$(curl -s 'http://hapi-fhir:8080/fhir/Bundle?_summary=count' | jq -r '.total // 0') &&
      if [ \"$$COUNT\" = \"0\" ]; then
        echo 'HAPI FHIR is empty — seeding StructureDefinitions and patient bundles...' &&
        bash /fhir/upload.sh;
      else
        echo \"HAPI FHIR already has $$COUNT Bundle(s) — skipping seed.\";
      fi
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # dev convenience: pick up theme edits without a container restart
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
    volumes:
      - ./keycloak/theme/hdx:/opt/keycloak/themes/hdx:ro
      # `start-dev`'s embedded H2 database lives here — without this the
      # realm/users/roles are gone (and every node_owner/node_id grant with
      # them) on every `docker compose down` + `up`, even though es-data and
      # minio-data survive.
      - keycloak-data:/opt/keycloak/data
    ports:
      # host 8081 (not 8080) so this stack can run alongside other
      # per-portal Keycloak dev instances (e.g. CBR's) without a clash
      - "8081:8080"

  kc-setup:
    image: python:3.12-alpine
    depends_on:
      - keycloak
    volumes:
      - ./keycloak/setup:/setup:ro
    environment:
      KC_URL: http://keycloak:8080        # admin API, inside compose network
      KC_PUBLIC_URL: http://localhost:8081 # browser-visible URL (Angular redirect URIs, issuer)
    command: python /setup/setup.py

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - minio-data:/data

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      (mc mb -p local/hdx-datasets || true)
      "

  controlplane:
    build: ./controlplane
    environment:
      PORT: 4000
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hdx/protocol/openid-connect/certs
      # Keycloak admin API access — grants node_owner + node_id on node approval (same
      # master-realm credentials keycloak/setup/setup.py already bootstraps with).
      KC_ADMIN_URL: http://keycloak:8080
      KC_ADMIN_USER: admin
      KC_ADMIN_PASSWORD: admin
      KC_REALM: hdx
      FILESERVER_URL: http://fileserver:4001
      CORS_ORIGIN: http://localhost:4300
    ports:
      - "4000:4000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      keycloak:
        condition: service_started

  fileserver:
    build: ./fileserver
    environment:
      PORT: 4001
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: hdx-datasets
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hdx/protocol/openid-connect/certs
      CORS_ORIGIN: http://localhost:4300
    ports:
      - "4001:4001"
    depends_on:
      minio:
        condition: service_healthy

  ui:
    build: ./hdx-ui
    ports:
      - "4300:80"
    depends_on:
      - controlplane
      - fileserver
      - keycloak

volumes:
  es-data:
  minio-data:
  keycloak-data:
  hapi-fhir-data:
