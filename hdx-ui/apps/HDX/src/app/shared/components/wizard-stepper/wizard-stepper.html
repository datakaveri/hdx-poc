<div class="stepper">
  @for (step of steps(); track step; let i = $index) {
    <div
      class="stepper__step"
      [class.stepper__step--active]="i === current()"
      [class.stepper__step--done]="i < current()"
      [class.stepper__step--clickable]="i < current()"
      (click)="onStepClick(i)"
    >
      <div class="stepper__circle">
        @if (i < current()) {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        } @else {
          <span>{{ i + 1 }}</span>
        }
      </div>
      <span class="stepper__label">{{ step }}</span>
      @if (i < steps().length - 1) {
        <div class="stepper__connector" [class.stepper__connector--done]="i < current()"></div>
      }
    </div>
  }
</div>
